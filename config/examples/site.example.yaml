# DPC site config, schema v3: grouped by program (CONTRACTS 7.1 and 9, D-048, D-055).
# Copy to ~/INSIGHTZZ/config/site.yaml, replace every value marked EDIT, then:
#     chmod 600 ~/INSIGHTZZ/config/site.yaml        # it holds secrets; the loader refuses it otherwise
#     cd ~/INSIGHTZZ/code && python3 -m common.config.site_config ~/INSIGHTZZ/config/site.yaml
# Have a v2 file? Convert it:  python3 scripts/convert_site_yaml_v3.py --help
# Never commit the real file. To share it (chat, mirror, UI), use only the redacted copy:
#     python3 -m common.config.site_config ~/INSIGHTZZ/config/site.yaml --redacted
# Never write a secret in a comment: comments are copied as they are.
# Unknown keys are errors. Quote serials, versions and secrets. Relative paths are relative to paths.root.
# Every program section may have log: {backup_count: N} (days of rotated logs, default 5).
# All values below are placeholders, not a real site.

schema_version: 3

# ---------- shared ----------
site:
  id: example_site                # EDIT; lowercase letters, digits, - or _
  name: "Example DPC"             # EDIT

paths:
  root: ~/INSIGHTZZ

db:
  host: localhost
  port: 3306
  name: example_db                # EDIT
  health_table: health_status     # new sites: health_status; existing sites set their own table
  user: dpc_app                   # EDIT; secret; root works but prints a warning (D-050); a dedicated user is recommended
  password: "CHANGE_ME"           # EDIT; secret

mqtt:
  host: localhost
  port: 1883
  user: ""                        # only when the broker has a login: give both user and password
  password: ""                    # secret

graph:                            # Microsoft Graph login, shared by mail (sender graph) and transfer
  tenant_id: "CHANGE_ME"          # EDIT; secret
  client_id: "CHANGE_ME"          # EDIT; secret
  client_secret: "CHANGE_ME"      # EDIT; secret

# ---------- programs ----------
capture:
  log: {backup_count: 5}
  health_interval_s: 600          # seconds between camera health rows (default 600)
  cameras:                        # 1 or 2 cameras; CAM1 = LEFT, CAM2 = RIGHT
    - id: CAM1
      side: LEFT
      driver: basler              # basler | flir
      serial: "00000001"          # EDIT; quoted
      fps: 4.0
      exposure_us: 1500
      rotate: 0                   # 0 | 90 | 180 | 270; must match the model's orientation
      # ip: 192.0.2.21            # optional GigE address: UI status, dpc-check ping (D-064)
    - id: CAM2
      side: RIGHT
      driver: basler
      serial: "00000002"          # EDIT
      fps: 4.0
      exposure_us: 2000
      rotate: 0
      # ip: 192.0.2.22
    # A FLIR camera needs a flir block (and only a FLIR camera may have one):
    #   flir: {interface: "GEV Interface 1", throughput_bps: 19662239}

inspection:
  log: {backup_count: 5}
  model:                          # which model only; files, classes and label map come from the package
    name: example_model           # EDIT; runs data/models/<name>/current, version managed by the Supervisor (D-060)
  threshold: 0.5
  machine:
    total_wheel_count: 190        # EDIT; wheel positions per revolution
    expected_cycle_total: 190     # wheels per revolution for the cycle-restart check; default = total_wheel_count
    # wheel-stand counts are learned by inspection, not set here (D-073 D8)
  live_wheel_counter_side: RIGHT  # the one side that writes the live wheel number for the UI (D-073 D3)
  checks:                         # switch a check off without touching code (D-085); all default true
    bucket_clip: true
    skidding: true
    wheel_missing: true
    cycle_restart: true
  # One side only: inspection.sides.<SIDE>.checks, e.g. RIGHT: {..., checks: {wheel_missing: false}}
  wheel_report: {daily_time: "17:58"}   # daily best image per wheel, both sides (D-073 D4); quoted
  sides:                          # one per configured camera side; object_sizes in pixels, EDIT for the site's model
    LEFT:  {object_sizes: {wheel_w: 530, wheel_h: 495, bucket_clip_w: 300, chain_w: 880, half_bucket_clip_w: 150}}
    RIGHT: {object_sizes: {wheel_w: 530, wheel_h: 495, bucket_clip_w: 300, chain_w: 880, half_bucket_clip_w: 150}}
  # Optional per-side tuning (D-072, D-073 D5). Leave out to keep each side's value from today's code;
  # set only what you change. Example for LEFT with its default values:
  #   LEFT:
  #     object_sizes: {...}
  #     model: {name: example_model_left}   # optional own model for this side (D-086); same classes;
  #                                         # default: inspection.model. Convention <base>_left / <base>_right
  #     motion: rtl                 # rtl | ltr (RIGHT default: ltr)
  #     bucket_clip_window: {xmin: 50, xmax: 1990, ymin: 750, ymax: 1085}
  #     half_bucket_clip_window: {xmin: 100, xmax: 1850, ymin: 470, ymax: 750}
  #     tracker:
  #       new_wheel_jump_px: 100
  #       new_plate_jump_px: 150
  #       high_dusty_suppress_px: 50
  #       clip_confirm: {frames: 5, min_pairs: 3, max_gap_ms: 300, max_dist_px: 200}      # RIGHT: 500 ms / 500 px
  #       skidding: {window_frames: 3, required_ratio: 0.7, time_gap_reset_ms: 500,       # RIGHT: 1000 ms
  #                  offset_px: 80, min_vertical_px: 8, vertical_factor: 0.5, same_wheel_scale: 0.5,
  #                  min_magnet_travel_px: 9, wheel_xmin: 20, wheel_xmax: 2025, magnet_check_min_wheel_w: 600}
  #       wheel_missing: {min_frames: 9, belt_stop_frames: 20, bbox: {xmin: 668, xmax: 1474, ymin: 508, ymax: 1278}}
  #       best_image_band_x: {min: 400, max: 850}   # wheel centre x for the best image per wheel (both sides)
  auto_roi:                       # auto region of interest (D-090..D-093); all keys optional, defaults shown
    mode: observe                 # off | observe | filter; without a learned roi.json every mode acts as off
    # margin_px: 100              # widen the learned region by this much
    # static_px: 3                # a box moving less than this between frames counts as static ...
    # static_share: 0.2           # ... and a point static this often is dropped while learning
    # min_per_point: 30           # detections needed per grid point
    # grid_steps: 10
    # top_percentile: 1           # region edges from these percentiles (top < bottom)
    # bottom_percentile: 99
    # mad_factor: 3.0             # outlier cut while learning
    # min_wheel_step_px: 5
    # learn_max_frames: 8000      # give up learning when no second plate comes within this many frames
    # outside_keep: 500           # outside-ROI crops kept ...
    # outside_crop_pad_px: 30
    # outside_max_per_minute: 60  # ... and written at most this often
    # drift_window: 200           # drift warning: share of detections outside the region ...
    # drift_ratio: 0.2            # ... above this over the last drift_window frames
    # preview_classes_per_image: 2   # classes shown together in one outside-ROI preview image (1-9)

plc:
  type: modbus_tcp
  ip: 192.0.2.10                  # EDIT; one PLC address per site
  port: 502
  timeout_s: 3
  light_register: 4109
  light_on_value: 1               # value that switches the light ON (1 at Tadipatri too, D-084); 0 only if inverted
  light_check_seconds: 60         # read the light this often, rewrite only when it differs (D-084)
  status_interval_seconds: 10     # conveyor status read + MQTT status
  cleaning_cooldown_seconds: 600  # minimum gap between automatic cleaning pulses
  auto_cleaning: false            # act on poor-view events; keep false until Q22 is decided
  cleaning_register: 4106
  conveyor_status_register: 4098
  cleaning_pulse_seconds: 10
  # legacy_db_numbers: {write: 12, read: 13}   # only for the legacy algorithm XML
  log: {backup_count: 5}

mail:
  sender: graph                   # graph (uses the shared graph login) | smtp
  sender_address: "reports@example.com"     # EDIT; the mailbox mails are sent from
  project_name: "Example_dpc"     # EDIT; used in mail subjects
  report_dir: data/reports
  recipients: ["alerts@example.com"]        # EDIT
  cc: []
  disk_report_to: []              # [] = the recipients above; daily disk report
  smtp: null                      # with sender smtp: {host: smtp.gmail.com, port: 587, password: "CHANGE_ME"}
  report_url: "http://192.0.2.50:8000/defects"   # optional link line in the alert mail; leave out = no link
  max_alert_age_hours: 24         # pending alerts older than this are never mailed; null = no limit (D-083)
  flood:                          # optional flood breaker; leave out or null = off (D-083)
    max_per_window: 8             # more alert mails than this in the window ...
    window_hours: 5
    internal_to: ["support@example.com"]   # ... and the next ones go only here
  log: {backup_count: 5}

cleanup:                          # all optional; these are the defaults
  raw_image_hours: 24
  interval_seconds: 10
  repeated: {days: 20, items: 200}
  plate_days: 10
  defective: {days: 10, items: 200}
  disk_percent: {delete: 75, raw_delete: 85, mail: 90, inference_delete: 95}   # strictly increasing
  disk_report_time: "09:00"       # daily disk mail (Graph only, D-082); quoted HH:MM
  log: {backup_count: 5}

transfer:                         # optional: leave out if this site runs no transfer service (D-104, D-105)
  drive: {site: "contoso.sharepoint.com:/sites/DPC"}   # EDIT; required; or {user: "dpc@example.com"} (OneDrive)
  models_folder: "DPC/models/<site.id>"   # default; holds <model>/<YYYY.MM.DD>.zip (D-105)
  upload:                         # optional: leave out = this site uploads nothing
    chunk_mb: 500                 # defaults shown
    remote_folder: "DPC/data/<site.id>"
    staging_max_gb: 20            # cap of data/transfer/staging
    max_mbps: 20                  # upload limit in megabits/s; null = unlimited
    plate_images: 100             # plate frames uploaded with a cycle; 0 = none
    # weekday: sunday             # no default: jobs are click-started (D-105), no schedule now
  log: {backup_count: 5}
# Model updates (auto_update, pin, switch) are Supervisor settings, not here (D-060).

ui:                               # the local web UI (D-095); optional, these are the defaults
  port: 8080                      # http://127.0.0.1:<port> on this machine only
  refresh_seconds: 2              # live refresh of the pages
  event_keep_days: 90             # stored events older than this are removed ...
  event_keep_rows: 50000          # ... and at most this many are kept
  log: {backup_count: 5}
