{# Top bar of every page except the overview: title, the same status pill (refreshed), clock. #}
<header class="card top pagetop">
  <div><div class="site">{{ title }}</div><div class="muted"><span>{{ site_name }}</span> · <span id="clock">&nbsp;</span></div></div>
  <span hx-get="/part/banner/" hx-trigger="every {{ refresh_seconds }}s" hx-swap="innerHTML">
    <a class="pill" href="/system/alerts/"><span class="dot"></span><span class="pilltext">…</span></a></span>
</header>
{% if active in system_pages %}
<nav class="tabs systabs" aria-label="System">
  <a href="/system/programs/" class="{% if active == 'programs' %}on{% endif %}" data-tip="Every program: state, restarts, logs">Programs</a>
  <a href="/system/health/" class="{% if active == 'health' %}on{% endif %}" data-tip="Disk, GPU, database, devices, dpc-check">Health</a>
  <a href="/system/alerts/" class="{% if active == 'alerts' %}on{% endif %}" data-tip="Everything that happened, newest first">Alert history</a>
</nav>{% endif %}
