{% load monitor_tags %}<div class="rows" id="dash-defects"{% if oob %} hx-swap-oob="true"{% endif %}>
  {% if defects_error %}<div class="row"><span class="c-warn">{{ defects_error }}</span><span></span></div>
  {% else %}{% for d in defects %}
  <a class="row" href="/defects/{{ d.ID }}/" data-tip="Open this defect with its image">
    <span>{{ d.defect_type|type_word }}</span>
    <span class="muted">{{ d.defect_side|first }} · wheel {{ d.wheel_no }} · {{ d.create_datetime|date:"H:i" }}</span></a>
  {% empty %}<div class="row"><span class="muted">No defects recorded.</span><span></span></div>
  {% endfor %}{% endif %}
</div>
