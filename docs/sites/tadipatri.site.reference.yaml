# Tadipatri site.yaml v3: REFERENCE COPY for chats and future sites (MASTER, 2026-10-22)
# - All real, non-secret values of the Tadipatri site (SITES.md, D-063, D-064).
# - Secrets and personal mail addresses are NOT here (the repo is public): placeholders
#   "<secret>" and "redacted@example.com" stand in. The real file lives only on the machine:
#   ~/INSIGHTZZ/config/site.yaml (chmod 600, D-048).
# - Not used by any program. To rebuild the real file: copy, replace the placeholders, chmod 600,
#   then: python3 -m common.config.site_config ~/INSIGHTZZ/config/site.yaml
schema_version: 3
site:
  id: tadipatri
  name: "Tadipatri DPC"
paths:
  root: /home/dpc_tadipatri/INSIGHTZZ
db:
  host: localhost
  port: 3306
  name: tadipatri4
  health_table: health_status     # renamed from tadipatri4_health_status_table on 2026-10-20
  user: root                      # allowed with a warning (D-050)
  password: "<secret>"
mqtt:
  host: localhost                 # mosquitto on this machine, no login
  port: 1883
  user: ""
  password: ""
graph:                            # shared by mail and transfer (D-055)
  tenant_id: "<secret>"
  client_id: "<secret>"
  client_secret: "<secret>"
capture:
  log: {backup_count: 5}
  cameras:
    - id: CAM1
      side: LEFT
      driver: basler
      serial: "24824427"
      fps: 4.0
      exposure_us: 1500
      rotate: 0
      ip: 192.168.1.102
    - id: CAM2
      side: RIGHT
      driver: basler
      serial: "24874775"
      fps: 4.0
      exposure_us: 2000
      rotate: 0
      ip: 192.168.1.103
inspection:
  log: {backup_count: 5}
  model:
    name: dpc_maskrcnn            # running version dpc_maskrcnn/2026.10.12 (Supervisor-managed, D-060)
  threshold: 0.5
  machine:
    total_wheel_count: 190
    expected_cycle_total: 190     # D-073 D8
  # live_wheel_counter_side: RIGHT   # D-073 D3; RIGHT is the default when a RIGHT camera exists
  wheel_report: {daily_time: "17:58"}   # D-073 D4 (default)
  sides:
    LEFT:  {object_sizes: {wheel_w: 530, wheel_h: 495, bucket_clip_w: 300, chain_w: 880, half_bucket_clip_w: 150}}
    RIGHT: {object_sizes: {wheel_w: 530, wheel_h: 495, bucket_clip_w: 300, chain_w: 880, half_bucket_clip_w: 150}}
  auto_roi: {mode: observe, learn_images: 30}
plc:
  type: modbus_tcp
  ip: 192.168.1.5                 # confirmed (Q20)
  port: 502
  timeout_s: 3
  light_register: 4109            # inverted: 0 = ON, 1 = OFF
  light_on_value: 0               # inverted light (D-064)
  cleaning_register: 4106         # 1 = ON, 0 = OFF
  conveyor_status_register: 4098
  cleaning_pulse_seconds: 10
  legacy_db_numbers: {write: 12, read: 13}   # S7 leftovers in the old inspection XML; the PLC is Modbus
  log: {backup_count: 5}
mail:
  sender: graph
  sender_address: "insightzz.reports@insightzz.com"
  project_name: "Tadipatri_dpc"
  recipients: ["redacted@example.com"]   # real list (11 addresses, = Maihar's for now) only on the machine
  cc: ["redacted@example.com"]           # real list (10 addresses) only on the machine
  disk_report_to: []
  log: {backup_count: 5}
cleanup:
  disk_report_time: "09:00"     # default (F29)
  raw_image_hours: 20             # Tadipatri 20 h (Maihar 24 h)
  interval_seconds: 10
  repeated: {days: 20, items: 200}
  plate_days: 10
  defective: {days: 10, items: 200}
  disk_percent: {delete: 75, raw_delete: 85, mail: 90, inference_delete: 95}
  log: {backup_count: 5}
# transfer: not configured yet (D-057, STATUS 9)
