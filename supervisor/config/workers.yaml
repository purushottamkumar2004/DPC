# ======================================================================
# DPC Supervisor configuration
# To add a new worker: copy one entry under "workers", change id/command.
# Nothing in the supervisor code needs to change.
# ======================================================================

monitoring:
  check_interval_seconds: 5      # how often every worker is checked
  worker_timeout_seconds: 10     # a failing health check must last this long before restart
  high_cost_timeout_seconds: 120 # the same, for restart_cost: high workers (algorithms, D-020)
  startup_stagger_seconds: 1     # pause between starting workers
  start_after_timeout_seconds: 120   # longest wait for a start_after dependency, then start anyway
  status_publish_interval_seconds: 30

# Default restart policy (each worker can override it with its own "restart:" block)
restart_policy:
  enabled: true
  max_retries: 3
  retry_delay_seconds: 5
  reset_after_seconds: 300       # healthy this long -> retry counter back to 0

mqtt:
  enabled: true                  # if the broker is down the supervisor still works
  host: localhost
  port: 1883
  topic_prefix: dpc

runtime:
  root: runtime                  # relative to the supervisor folder (or use an absolute path)

log_dir: logs

# ======================================================================
# Workers
#   mode:            service (default, runs forever) | oneshot (runs once; exit 0 = done)
#                    | periodic (runs every interval_s seconds, start to start, never overlapping)
#   restart_cost:    normal (default) | high: must fail high_cost_timeout_seconds before a restart
#   start_after:     [ids] started first and ready (service RUNNING, oneshot/periodic finished OK)
#   env_from_site:   true = gets the DPC_* variables from site.yaml (CONTRACTS 9); never logged
#   health.type:
#     process        - only "is the process alive"
#     file_activity  - a file/folder must have changed within max_age_seconds
#     heartbeat      - worker publishes to dpc/worker/<id>/health
#     queue_lag      - oldest file in path (INF) younger than max_oldest_age_seconds;
#                      require_heartbeat: true also needs a fresh heartbeat (max_age_seconds)
# Paths: never a site value here. ~ and relative paths are fine; the real file per site
# lives in <root>/config/ (STATUS item 4).
# ======================================================================
workers:

  # ---------------- test workers (enabled so you can try it right now) ----------------
  - id: dummy_crasher            # crashes every 20 s -> shows restart, then FAILED after 3 retries
    type: dummy
    enabled: true
    command: python3 workers/dummy_worker.py --crash-after 20
    runtime_dir: DUMMY1
    directories: [raw, logs]
    restart: { max_retries: 3, retry_delay_seconds: 5, reset_after_seconds: 600 }

  - id: dummy_hanger             # stays alive but stops working after 25 s -> shows health-based restart
    type: dummy
    enabled: true
    command: python3 workers/dummy_worker.py --hang-after 25 --heartbeat-file runtime/DUMMY2/logs/heartbeat.txt
    runtime_dir: DUMMY2
    directories: [logs]
    health:
      type: file_activity
      path: runtime/DUMMY2/logs/heartbeat.txt
      max_age_seconds: 8
      startup_grace_seconds: 8

  # ---------------- real workers: shapes only, disabled (site entries: STATUS item 4) ----------------
  - id: plc_light                # oneshot: switch the light on once, then exit 0 (D-019)
    type: plc
    enabled: false
    mode: oneshot
    command: python3 light.py
    working_directory: ~/INSIGHTZZ/code/workers/plc

  - id: frame_capture_cam1       # one capture per camera (D-033)
    type: frame_capture
    enabled: false
    start_after: [plc_light]
    command: python3 FrameCapture_Basler.py
    working_directory: ~/INSIGHTZZ/code/workers/frame_capture_basler
    stop_signal: SIGINT          # releases the camera on Ctrl+C
    stop_timeout_seconds: 30
    health:
      type: file_activity        # live/IMG_1.jpg is replaced on every frame (atomic hand-off)
      path: ~/INSIGHTZZ/data/frames/CAM1/live/IMG_1.jpg
      max_age_seconds: 30
      startup_grace_seconds: 60

  - id: inspection_left
    type: inspection
    enabled: false
    follows: frame_capture_cam1  # D-068: runs only while its capture is healthy
    restart_cost: high           # a restart loses wheel counter + plate state and the INF backlog
    command: python3 inspection.py
    working_directory: ~/INSIGHTZZ/code/workers/inspection
    stop_timeout_seconds: 20
    health:
      type: queue_lag            # D-020; keep the limit above the normal backlog at this site's fps
      path: ~/INSIGHTZZ/data/frames/CAM1/INF
      max_oldest_age_seconds: 120
      require_heartbeat: false   # true after F25 (D-049, Q1)
      max_age_seconds: 60        # heartbeat limit, used only with require_heartbeat: true
      startup_grace_seconds: 180 # Detectron2 model loading

  - id: cleanup
    type: cleanup
    enabled: false
    command: python3 cleanup.py  # settings from rendered/cleanup.json (P9); no env_from_site
    working_directory: ~/INSIGHTZZ/code/workers/cleanup

  - id: light_reassert           # example periodic job (a PLC reboot leaves the light off, D-024)
    type: plc
    enabled: false
    mode: periodic
    interval_s: 60
    command: python3 light.py
    working_directory: ~/INSIGHTZZ/code/workers/plc
