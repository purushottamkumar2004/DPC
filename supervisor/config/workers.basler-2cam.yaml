# =====================================================================
# Supervisor workers file for a site with TWO Basler cameras and two inspection sides
# (first used at Tadipatri).
#
# Deploy: copy to <root>/config/workers.yaml; supervisor.py finds it there without -c (F19).
# Nothing in here is site-specific: every camera, inspection and site setting is in
# site.yaml, rendered to <root>/config/rendered/<worker id>.json; the Supervisor gives each
# worker its file in DPC_WORKER_CONFIG (D-062).
# If paths.root in site.yaml is not ~/INSIGHTZZ, change the ~/INSIGHTZZ paths below.
# No secrets in this file. `python3 supervisor.py check-config -c <this file>` validates it.
# =====================================================================

mqtt:
  enabled: true
  host: localhost            # local broker (D-034: the site keeps inspecting if it is down)
  port: 1883
  topic_prefix: dpc
  # the broker login is mqtt.user / mqtt.password in site.yaml (F11), never here

monitoring:
  check_interval_seconds: 2      # a dead capture is seen within 2 s (STATUS 4b: restart within 10 s)
  worker_timeout_seconds: 10     # a failing health check must last this long before a restart
  high_cost_timeout_seconds: 120 # not used by captures (restart_cost normal); kept for the algorithms
  startup_stagger_seconds: 1     # the two cameras are not opened in the same second
  start_after_timeout_seconds: 120
  status_publish_interval_seconds: 30
  # reload_quiet_window: "02:00-03:00"   # restart_cost: high workers pick up a new config here;
  #                                      # without it: supervisor.py reload --confirm

restart_policy:                  # defaults; the captures set their own below
  max_retries: 3
  retry_delay_seconds: 5
  reset_after_seconds: 300

runtime:
  root: ~/INSIGHTZZ/run          # pid files (CONTRACTS 4.1)
log_dir: ~/INSIGHTZZ/logs        # supervisor.log here, each worker's stdout in logs/workers/<id>.log

# ---------------------------------------------------------------------
# Why these capture numbers (FrameCapture_Basler, PR #2):
#  * The capture reopens a lost camera by itself: no good frame for 15 s -> reopen, retried
#    every 2 s; frames resume within ~30 s of a replug (cable test 2026-10-20). The Supervisor
#    should only step in when that did not work, so live/IMG_1.jpg may be 60 s old (at 4 fps
#    it is replaced 4 times a second). Restart after 60 s stale + 10 s worker_timeout.
#  * A restart is cheap (no in-memory state, D-031 hand-off is atomic, stale _tmp is cleared
#    at start) and the capture keeps retrying the camera itself, so retries are many and fast.
#    During a long cable-out one retry takes about 45 s (30 s grace + 10 s timeout + delay):
#    30 retries = about 20 minutes before FAILED. After 300 s healthy the count is back to 0.
#  * SIGTERM finishes the current frame and closes the camera (_tmp left empty); 15 s is ample.
# ---------------------------------------------------------------------
workers:
  - id: frame_capture_cam1       # CAM1 = LEFT (CONTRACTS 4.1), worker id from D-033
    type: frame_capture
    command: python3 FrameCapture_Basler.py
    working_directory: ~/INSIGHTZZ/code/workers/frame_capture_basler
    stop_signal: SIGTERM
    stop_timeout_seconds: 15
    restart:
      max_retries: 30
      retry_delay_seconds: 2
      reset_after_seconds: 300
    health:
      type: file_activity
      path: ~/INSIGHTZZ/data/frames/CAM1/live/IMG_1.jpg
      max_age_seconds: 60
      startup_grace_seconds: 30  # camera open + settings take a few seconds

  - id: frame_capture_cam2       # CAM2 = RIGHT
    type: frame_capture
    command: python3 FrameCapture_Basler.py
    working_directory: ~/INSIGHTZZ/code/workers/frame_capture_basler
    stop_signal: SIGTERM
    stop_timeout_seconds: 15
    restart:
      max_retries: 30
      retry_delay_seconds: 2
      reset_after_seconds: 300
    health:
      type: file_activity
      path: ~/INSIGHTZZ/data/frames/CAM2/live/IMG_1.jpg
      max_age_seconds: 60
      startup_grace_seconds: 30

  # ---- inspection: one program for both sides (D-069, D-076) ----
  # Each side follows its camera (D-068, D-070): it starts once the capture is RUNNING, is
  # paused while that capture is down, and is started once when it is healthy again.
  # restart_cost high: a restart loses the wheel counter and plate state (D-020), so a failing
  # health check must last high_cost_timeout_seconds (120 s) before a restart. A crash
  # (exit 1) is still restarted at once; its cause is in <root>/run/<id>.last_error.json and
  # shows up in the worker_failure event, the status and supervisor.log (F21).
  - id: inspection_left
    type: inspection
    follows: frame_capture_cam1
    restart_cost: high
    command: python3 inspection.py
    working_directory: ~/INSIGHTZZ/code/workers/inspection
    stop_timeout_seconds: 20         # SIGTERM: finish the current frame, exit 0
    health:
      type: queue_lag                # oldest INF frame waiting (D-020)
      path: ~/INSIGHTZZ/data/frames/CAM1/INF
      max_oldest_age_seconds: 120
      require_heartbeat: false       # true after F25 (heartbeat publishing checked on site)
      max_age_seconds: 60            # heartbeat limit, used once require_heartbeat is true
      startup_grace_seconds: 180     # model loading

  - id: inspection_right
    type: inspection
    follows: frame_capture_cam2
    restart_cost: high
    command: python3 inspection.py
    working_directory: ~/INSIGHTZZ/code/workers/inspection
    stop_timeout_seconds: 20
    health:
      type: queue_lag
      path: ~/INSIGHTZZ/data/frames/CAM2/INF
      max_oldest_age_seconds: 120
      require_heartbeat: false
      max_age_seconds: 60
      startup_grace_seconds: 180
